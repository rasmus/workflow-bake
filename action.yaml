name: 'Bake'
description: 'Bakes your code'

inputs:
  # Required ======================
  version:
    required: true
  # Optional ======================
  bake-convention:
    required: false
    default: 'default'
  bake-version:
    required: false
    default: '0.37.51'
  bake-destination:
    required: false
    default: 'nuget>github,container>rasmus,release>github,helm-chart>chart-museum@http://chart-museum.chart-museum/'
  git-lfs:
    required: false
  dotnet-version:
    required: false
    default: '8.0.x'
  dotnet-environment:
    required: false
    default: 'Development'
  helm-version:
    required: false
    default: '3.16.2'
  helm-install:
    required: false
  kind-install:
    required: false
  kind-version:
    required: false
    default: 'v0.25.0'
  docker-compose-up-timeout:
    required: false
    default: '300'
  docker-compose-failed-logs-tail:
    required: false
    default: '512' # can be 'all'
  tailscale-enabled:
    required: false
  # Secrets ======================
  tailscale-oauth-client-id:
    required: false
  tailscale-oauth-client-secret:
    required: false
  tailscale-exit-node:
    required: false
  github-packages-token:
    required: false
  dockerhub-password:
    required: false

runs:
  using: "composite"
  steps:
  # https://github.com/simonw/til/blob/main/tailscale/tailscale-github-actions.md
  # https://github.com/tailscale/tailscale/issues/4152
  - name: Tailscale
    if: inputs.tailscale-enabled
    uses: tailscale/github-action@v3
    with:
      oauth-client-id: "${{ inputs.tailscale-oauth-client-id }}"
      oauth-secret: "${{ inputs.tailscale-oauth-client-secret }}"
      tags: tag:github-actions

  - name: Use named exit node in Tailscale
    if: inputs.tailscale-enabled
    shell: bash
    run: |
      timeout 5m sudo -E tailscale set --exit-node=${{ inputs.tailscale-exit-node }} --exit-node-allow-lan-access=true

  - name: Checkout code
    uses: actions/checkout@v4
    with:
      lfs: ${{ inputs.git-lfs }}

  - name: Install Helm
    if: inputs.helm-install
    uses: azure/setup-helm@v4
    with:
      version: '${{ inputs.helm-version }}'

  - name: Install kind
    if: inputs.kind-install
    uses: helm/kind-action@v1
    with:
      install_only: true
      version: ${{ inputs.kind-version }}

  - name: Docker Hub login
    shell: bash
    run: |
      if [ -n "${{ inputs.dockerhub-password }}" ]; then
        echo "${{ inputs.dockerhub-password }}" | docker login -u rasmus --password-stdin
      fi

  - name: Docker compose up (if present)
    shell: bash
    run: |
      if [ -f docker-compose.yml ]; then
        echo "Docker compose file found, starting services in $PWD..."
        docker-compose up \
          --detach \
          --wait \
          --quiet-pull \
          --wait-timeout ${{ inputs.docker-compose-up-timeout }}
      fi

  - name: Install .NET
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: '${{ inputs.dotnet-version }}'

  - name: Setup GitHub NuGet source
    shell: bash
    run: |
      if [ -n "${{ inputs.github-packages-token }}" ]; then
        dotnet nuget add source \
          --username rasmus \
          --password ${{ inputs.github-packages-token }} \
          --store-password-in-clear-text \
          --name github-rasmus \
          "https://nuget.pkg.github.com/rasmus/index.json" || true
      fi

  - name: Bake it
    env:
      dockerhub_username: rasmus
      dockerhub_password: ${{ inputs.dockerhub-password }}
      ASPNETCORE_ENVIRONMENT: ${{ inputs.dotnet-environment }}
      DOTNET_ENVIRONMENT: ${{ inputs.dotnet-environment }}
      DOCKER_BUILDKIT: 1
      GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
    shell: bash
    run: |
      dotnet tool install --global Bake --version ${{ inputs.bake-version }} --add-source https://api.nuget.org/v3/index.json --verbosity diag
      export PATH="$PATH:/home/ubuntu/.dotnet/tools"

      bake run \
        --convention=${{ inputs.bake-convention }} \
        --build-version ${{ inputs.version }} \
        --destination="${{ inputs.bake-destination }}"

  - name: Print Docker compose logs on failure
    if: failure()
    shell: bash
    run: |
      if [ -f docker-compose.yml ]; then
        docker-compose logs \
          -t \
          --no-color \
          --tail ${{ inputs.docker-compose-failed-logs-tail }}
      fi
